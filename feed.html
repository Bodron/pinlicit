<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.video-slide');
            const navItems = document.querySelectorAll('nav button');

            // Category chip behavior
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    navItems.forEach(nav => {
                        nav.classList.remove('bg-primary-container', 'text-white', 'active-tab-pill');
                        nav.classList.add('bg-surface-container', 'text-on-surface-variant');
                    });
                    item.classList.add('bg-primary-container', 'text-white', 'active-tab-pill');
                    item.classList.remove('bg-surface-container', 'text-on-surface-variant');
                });
            });

            // Simple intersection observer for fading in content on scroll
            const observerOptions = {
                threshold: 0.5
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const overlay = entry.target.querySelector('.glass-panel');
                    if (entry.isIntersecting) {
                        overlay.style.opacity = '1';
                        overlay.style.transform = 'translateY(0)';
                    } else {
                        overlay.style.opacity = '0';
                        overlay.style.transform = 'translateY(20px)';
                    }
                });
            }, observerOptions);

            slides.forEach(slide => {
                const overlay = slide.querySelector('.glass-panel');
                overlay.style.transition = 'all 0.6s ease-out';
                observer.observe(slide);
            });
        });
    </script>
