workflows:
  ios-app-store:
    name: Pinbind iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pinbind.ro
      vars:
        BUNDLE_ID: com.pinbind.ro
        APP_NAME: Pinbind
        API_BASE_URL: https://pinbind.bcmenu.ro
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -e
          case "$API_BASE_URL" in
            https://?*) ;;
            *) echo "API_BASE_URL must be a public HTTPS backend URL."; exit 1 ;;
          esac
          flutter build ipa --release \
            --export-options-plist="$CM_EXPORT_OPTIONS_PLIST" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/ios/Release-iphoneos/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        expire_build_submitted_for_review: true
        submit_to_app_store: false
